[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-rule-miner"
version = "0.1.0"
description = "Mine AI chat history for cross-project correction patterns"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
]

[project.scripts]
ai-rule-miner = "mine_corrections:main"
ai-rule-miner-mcp = "mcp_server:main"

[tool.setuptools]
py-modules = ["mine_corrections", "diagnose", "mcp_server"]
